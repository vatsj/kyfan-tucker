[pytest]
testpaths = tests
markers =
    slow: 10-70 s each (exhaustive certificate checks, CP-SAT optimality, S^3 dual solves); `make test-slow`
    veryslow: minutes each (S^3 degree-3 dense GF(2) lower bound ~7 min; S^2 Q degree-5 ~5 min); `make test-veryslow`
# default = fast + slow (~5 min); the fast tier alone is `make test-fast` (-m "not slow and not veryslow", ~1.5 min)
addopts = -m "not veryslow"
