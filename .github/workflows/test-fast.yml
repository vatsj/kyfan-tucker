name: fast tier
on: [push, pull_request, workflow_dispatch]
jobs:
  test-fast:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: dtolnay/rust-toolchain@stable
      - name: build gf2solve
        run: cargo build --release --manifest-path gf2solve/Cargo.toml
      - name: install
        run: python -m pip install -r requirements.txt
      - name: fast tier
        run: make test-fast PY=python
